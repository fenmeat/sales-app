name: Payroll browser acceptance
on:
  push:
    branches: [payroll/fresh-start-20261116, fix/payroll-hourly-review, fix/staff-clock-history, fix/payroll-monday-breaks]
    paths:
      - 'v2/**'
      - '.github/workflows/payroll-acceptance.yml'
permissions:
  contents: read
jobs:
  payroll:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm install --prefix "$RUNNER_TEMP/payroll-browser" playwright@1.62.1 --no-audit --no-fund
      - run: node "$RUNNER_TEMP/payroll-browser/node_modules/playwright/cli.js" install --with-deps chromium webkit
      - name: Exercise the Fen-only hourly week, paid day off and zero-PAYE payslip
        run: STAFF_PLAYWRIGHT_MODULE="$RUNNER_TEMP/payroll-browser/node_modules/playwright/index.mjs" node scripts/qa-payroll.mjs --fen-hourly
      - name: Exercise both Friday screens, payslip PDF, CSV and printed month report
        run: STAFF_PLAYWRIGHT_MODULE="$RUNNER_TEMP/payroll-browser/node_modules/playwright/index.mjs" node scripts/qa-payroll.mjs
      - name: Check Staff history on iPhone, iPad, Android and desktop browser profiles
        run: STAFF_PLAYWRIGHT_MODULE="$RUNNER_TEMP/payroll-browser/node_modules/playwright/index.mjs" node scripts/qa-staff-history.mjs
